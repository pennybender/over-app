<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Life">

<title>Life dashboard</title>

<style>

:root { --bg:#f4f5f7; --card:#fff; --ink:#15181d; --dim:#6b7380; --line:#dfe2e7; --acc:#0b6bcb; color-scheme: light dark; }

@media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#191c22; --ink:#eceef2; --dim:#98a0ad; --line:#2a2e37; --acc:#5aa9ff; } }

* { box-sizing: border-box; }

body { margin:0; font:16px/1.4 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%; }

header { position:sticky; top:0; z-index:5; background:var(--bg); padding:env(safe-area-inset-top) 12px 0; border-bottom:1px solid var(--line); }

.top { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 0 6px; }

.actions { display:flex; gap:6px; }

h1 { font-size:20px; margin:0; }

#sub { margin:0; font-size:13px; color:var(--dim); }

button { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; min-height:40px; }

button.primary { background:var(--acc); color:var(--card); border-color:var(--acc); font-weight:600; }

nav { display:flex; gap:6px; overflow-x:auto; padding:4px 0 8px; scrollbar-width:none; }

nav::-webkit-scrollbar { display:none; }

nav button, .chip { flex:none; white-space:nowrap; border-radius:999px; padding:6px 12px; min-height:36px; font-size:14px; }

nav button.on, .chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }

main { padding:12px 12px calc(40px + env(safe-area-inset-bottom)); max-width:720px; margin:0 auto; }

section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px; }

h2 { font-size:17px; margin:0 0 8px; }

h3 { font-size:13px; margin:16px 0 4px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }

.chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }

.row { display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:6px 0; border-bottom:1px solid var(--line); }

input, select, textarea { font:inherit; font-size:16px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:7px 8px; min-height:38px; min-width:0; }

input[type=checkbox] { width:24px; height:24px; min-height:0; flex:none; accent-color:var(--acc); }

input[type=date] { width:9.6em; }

input[type=time] { width:6.5em; }

select { max-width:11em; }

textarea { width:100%; resize:none; overflow:hidden; }

.row textarea { flex:1 1 0; width:auto; }

.grow { flex:1 1 9em; }

.amt { width:5.5em; text-align:right; }

.time { width:5.2em; }

.dm { width:4.4em; }

.del { border:none; background:none; color:var(--dim); font-size:22px; padding:0 8px; min-height:38px; margin-left:auto; }

.add { margin-top:8px; border-style:dashed; color:var(--acc); width:100%; }

.calc { font-size:14px; color:var(--dim); font-variant-numeric:tabular-nums; }

.out { white-space:pre-wrap; font-size:15px; margin-top:12px; padding:10px; background:var(--bg); border-radius:10px; font-variant-numeric:tabular-nums; }

.note { font-size:13px; color:var(--dim); margin:6px 0; }

.set { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; font-size:14px; padding:4px 0; }

</style>

</head>

<body>

<header>

  <div class="top">

    <div><h1 id="date"></h1><p id="sub"></p></div>

    <div class="actions">

      <button id="loadBtn">Load</button>

      <button id="saveBtn" class="primary">Save</button>

    </div>

  </div>

  <nav id="tabs"></nav>

</header>

<main id="main"></main>

<input type="file" id="file" accept=".json,application/json" hidden>



<script>

'use strict';

const KEY = 'life-data', DIRTY = 'life-dirty', FILE = 'life-data.json';

const SECTIONS = { schedule:'Schedule', calendar:'Calendar', bills:'Bills', appointments:'Appointments', todo:'To do',

  spend:'Spending priorities', budget:'Budget', money:'Savings & investing', goals:'Goals', challenges:'Challenges', values:'Values' };

const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];



const $ = id => document.getElementById(id);

const num = v => parseFloat(v) || 0;

const pad = n => String(n).padStart(2, '0');

const up = v => Math.ceil(v - 1e-9);

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const fit = t => { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; };

const dayNum = iso => { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(iso || ''); return m ? Date.UTC(+m[1], m[2] - 1, +m[3]) / 864e5 : NaN; };

const dm = s => { const m = /^\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*$/.exec(s || ''); return m ? (+m[1]) + '/' + (+m[2]) : ''; };



const blank = () => ({

  version: 1,

  settings: { timezone: '', altAnchor: '', combined: ['schedule','calendar','bills','appointments','todo','spend','money','values'] },

  schedule: {}, calendar: [], bills: [], appointments: [], todo: [], spend: [],

  budget: { accounts: [], investAccount: '', income: [], fortnightly: [], monthly: [], annual: [], emergencies: [], electricity: [] },

  money: { savingsTarget: 0, savingsBalance: 0, investGoal: 0, mortgageRate: 0, mortgageThreshold: 0, holdings: [] },

  goals: [], challenges: [], values: []

});

function normalise(d) {

  const b = blank(), out = Object.assign({}, b, d);

  out.settings = Object.assign(b.settings, d.settings);

  out.budget = Object.assign(b.budget, d.budget);

  out.money = Object.assign(b.money, d.money);

  return out;

}



let data = null, dirty = false, tab = 'combined', derived = [], lastDay = '';

try {

  const s = localStorage.getItem(KEY);

  if (s) { data = normalise(JSON.parse(s)); dirty = localStorage.getItem(DIRTY) === '1'; }

} catch (e) {}



function store() {

  try { localStorage.setItem(KEY, JSON.stringify(data)); localStorage.setItem(DIRTY, dirty ? '1' : ''); } catch (e) {}

}

function changed(full) {

  dirty = true; store();

  if (full) render(); else { derived.forEach(f => f()); paintHeader(); }

}



/* ---------- dates ---------- */

function today() {

  const o = { year: 'numeric', month: 'numeric', day: 'numeric', weekday: 'long' };

  let parts;

  try { parts = new Intl.DateTimeFormat('en-AU', Object.assign({ timeZone: (data && data.settings.timezone) || undefined }, o)).formatToParts(new Date()); }

  catch (e) { parts = new Intl.DateTimeFormat('en-AU', o).formatToParts(new Date()); }

  const p = {}; parts.forEach(x => { p[x.type] = x.value; });

  const y = +p.year, m = +p.month, d = +p.day;

  return { weekday: p.weekday, iso: y + '-' + pad(m) + '-' + pad(d), dm: d + '/' + m, label: p.weekday + ' ' + d + ' ' + MONTHS[m - 1] };

}

function schedKey(t) {

  const a = dayNum(data.settings.altAnchor);

  const alt = !isNaN(a) && Math.floor((dayNum(t.iso) - a) / 7) % 2 === 0;

  const k = t.weekday + '_alt';

  return { alt, key: alt && Array.isArray(data.schedule[k]) ? k : t.weekday };

}

function rel(iso, t, past) {

  const n = dayNum(iso) - dayNum(t.iso);

  if (isNaN(n)) return '';

  if (n === 0) return 'today';

  if (n === 1) return 'tomorrow';

  if (n > 1) return 'in ' + n + ' days';

  return -n + (n === -1 ? ' day ' : ' days ') + past;

}



/* ---------- DOM helpers ---------- */

function h(tag, props, ...kids) {

  const e = document.createElement(tag);

  for (const k in props || {}) {

    const v = props[k];

    if (v == null || v === false) continue;

    if (k === 'class') e.className = v;

    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);

    else e.setAttribute(k, v);

  }

  kids.flat(Infinity).forEach(c => { if (c != null && c !== false) e.append(c); });

  return e;

}

function calc(fn, cls, tag) {

  const s = h(tag || 'span', { class: cls || 'calc' });

  const f = () => { s.textContent = fn(); };

  f(); derived.push(f);

  return s;

}

function field(obj, key, type, label, cls) {

  type = type || 'text';

  if (type === 'check') {

    const c = h('input', { type: 'checkbox', checked: !!obj[key], 'aria-label': label });

    c.addEventListener('change', () => { obj[key] = c.checked; changed(); });

    return c;

  }

  const isNum = type === 'number' || type === 'signed';

  const val = obj[key] == null ? '' : obj[key];

  const i = type === 'area'

    ? h('textarea', { rows: 1, placeholder: label, 'aria-label': label, class: cls }, String(val))

    : h('input', { type: isNum ? 'text' : type, inputmode: type === 'number' ? 'decimal' : null, value: val, placeholder: label, 'aria-label': label, class: cls });

  i.addEventListener('input', () => { obj[key] = isNum ? num(i.value) : i.value; if (type === 'area') fit(i); changed(); });

  return i;

}

function select(obj, key, options, label) {

  const s = h('select', { 'aria-label': label }, options.map(o => h('option', { value: o, selected: o === (obj[key] || '') }, o || '— none —')));

  s.addEventListener('change', () => { obj[key] = s.value; changed(); });

  return s;

}

const setting = (label, control) => h('label', { class: 'set' }, h('span', {}, label), control);



function list(arr, cols, make, o) {

  o = o || {};

  const box = h('div');

  let shown = 0;

  arr.forEach((it, i) => {

    if (o.filter && !o.filter(it)) return;

    shown++;

    box.append(h('div', { class: 'row' },

      cols.map(c => typeof c === 'function' ? c(it, arr, i) : field(it, c.k, c.t, c.ph, c.cls)),

      h('button', { class: 'del', 'aria-label': 'Delete', onclick: () => { if (confirm('Delete this item?')) { arr.splice(i, 1); changed(true); } } }, '×')));

  });

  if (!shown && o.empty) box.append(h('p', { class: 'note' }, o.empty));

  box.append(h('button', { class: 'add', onclick: () => { arr.push(make()); changed(true); } }, o.add || '+ Add'));

  return box;

}



/* ---------- calculations ---------- */

function budgetCalc() {

  const b = data.budget;

  const sum = a => a.reduce((s, x) => s + num(x), 0);

  const elec = b.electricity.length ? sum(b.electricity) / b.electricity.length * 4 : 0;

  const amt = it => it.auto === 'electricity' ? elec : it.auto === 'emergencies' ? sum(b.emergencies) : num(it.amount);

  const income = b.income.reduce((s, x) => s + num(x.amount), 0);

  const acc = {};

  let expense = 0;

  const add = (items, f) => items.forEach(it => { const v = amt(it) * f, a = it.account || ''; expense += v; acc[a] = (acc[a] || 0) + v; });

  add(b.fortnightly, 1); add(b.monthly, 12 / 26); add(b.annual, 1 / 26);

  return { income, expense, acc, elec, amt };

}

function budgetText() {

  const c = budgetCalc(), b = data.budget, inc = Math.floor(c.income), left = Math.floor(c.income - c.expense);

  const L = [

    'Fortnightly income after tax: $' + inc,

    'Fortnightly expenses: $' + Math.floor(c.expense),

    'Fortnightly saving: $' + left,

    'Percent of income invested: ' + (inc ? ((c.acc[b.investAccount] || 0) / inc * 100).toFixed(1) : '0.0') + '%',

    '', 'TRANSFERS',

    '1) Move total fortnightly income to the transactions account for distribution.'

  ];

  let n = 2;

  const order = [...new Set([...b.accounts, ...Object.keys(c.acc)])].filter(a => a && a in c.acc);

  order.forEach(a => L.push((n++) + ') Transfer $' + up(c.acc[a]) + ' to ' + a));

  if (c.acc[''] > 0) L.push((n++) + ') $' + up(c.acc['']) + ' has no account assigned');

  L.push(n + ') $' + left + ' is the remainder.');

  return L.join('\n');

}

function moneyText() {

  const m = data.money, hs = m.holdings;

  const total = hs.reduce((s, x) => s + num(x.value), 0);

  const pct = (a, b) => num(b) ? Math.floor(num(a) / num(b) * 100) : 0;

  const L = [

    "You're " + pct(m.savingsBalance, m.savingsTarget) + '% of the way to your savings account target balance!',

    "You're " + pct(total, m.investGoal) + '% of the way to your annual investment goal!',

    '',

    'Home loan rate: ' + num(m.mortgageRate).toFixed(2) + '%',

    'Mortgage threshold: ' + num(m.mortgageThreshold).toFixed(2) + '%',

    ''

  ];

  if (num(m.mortgageRate) >= num(m.mortgageThreshold)) { L.push('Invest next in: MORTGAGE (extra repayment)'); return L.join('\n'); }

  L.push('Rate below threshold -> rebalancing portfolio instead.', '', 'Total portfolio: $' + total.toLocaleString('en-AU'), '');

  if (!total) { L.push('Add holdings to get a rebalancing suggestion.'); return L.join('\n'); }

  let best = '', gap = -Infinity;

  hs.forEach(x => {

    const cur = num(x.value) / total * 100, d = num(x.target) - cur;

    L.push(x.asset + ': ' + cur.toFixed(2) + '% now, target ' + num(x.target).toFixed(2) + '%, gap ' + (d >= 0 ? '+' : '') + d.toFixed(2) + '%');

    if (d > gap) { gap = d; best = x.asset; }

  });

  L.push('', 'Invest next in: ' + best);

  return L.join('\n');

}



/* ---------- sections ---------- */

const R = {

  schedule(compact) {

    const t = today(), s = data.schedule, sk = schedKey(t);

    const day = k => list(s[k] || (s[k] = []), [{ k: 'time', ph: 'Time', cls: 'time' }, { k: 'text', ph: 'What', cls: 'grow' }], () => ({ time: '', text: '' }));

    const name = k => k.replace('_alt', ' (alt week)');

    if (compact) return [h('h3', {}, name(sk.key)), day(sk.key)];

    const out = [

      setting('Alt weeks count from', field(data.settings, 'altAnchor', 'date', 'Anchor date')),

      setting('Timezone', field(data.settings, 'timezone', 'text', 'e.g. Australia/Sydney')),

      h('p', { class: 'note' }, calc(() => 'This is ' + (schedKey(today()).alt ? 'an alt week.' : 'a normal week.')))

    ];

    DAYS.forEach(d => {

      const a = d + '_alt';

      out.push(h('h3', {}, d + (d === t.weekday ? ' · today' : '')), day(d));

      if (Array.isArray(s[a])) out.push(h('h3', {}, name(a)), day(a),

        h('button', { class: 'add', onclick: () => { if (confirm('Remove the alt-week version of ' + d + '?')) { delete s[a]; changed(true); } } }, 'Remove alt-week ' + d));

      else out.push(h('button', { class: 'add', onclick: () => { s[a] = JSON.parse(JSON.stringify(s[d])); changed(true); } }, '+ Alt-week version of ' + d));

    });

    return out;

  },

  calendar(compact) {

    const t = today(), c = data.calendar;

    const cols = [{ k: 'date', ph: 'd/m', cls: 'dm' }, { k: 'text', ph: 'Event', cls: 'grow' }];

    if (compact) return list(c, cols, () => ({ date: t.dm, text: '' }),

      { filter: e => dm(e.date) === t.dm, empty: 'Nothing from your calendar today.', add: '+ Add for today' });

    const key = e => { const m = dm(e.date).split('/'); return m[1] ? m[1] * 100 + (+m[0]) : 9999; };

    c.sort((a, b) => key(a) - key(b));

    return list(c, cols, () => ({ date: '', text: '' }));

  },

  bills() {

    const t = today();

    return [

      list(data.bills, [{ k: 'paid', t: 'check', ph: 'Paid' }, { k: 'name', ph: 'Bill', cls: 'grow' }, { k: 'due', t: 'date', ph: 'Due' },

        { k: 'amount', t: 'number', ph: '$', cls: 'amt' }, b => calc(() => b.paid ? 'paid' : rel(b.due, t, 'overdue'))],

        () => ({ name: '', due: '', amount: 0, paid: false })),

      h('p', { class: 'note' }, calc(() => 'Unpaid total: $' + data.bills.filter(b => !b.paid).reduce((s, b) => s + num(b.amount), 0).toFixed(2)))

    ];

  },

  appointments() {

    const t = today();

    return list(data.appointments, [{ k: 'name', ph: 'Appointment', cls: 'grow' }, { k: 'date', t: 'date', ph: 'Date' }, { k: 'time', t: 'time', ph: 'Time' },

      { k: 'notes', ph: 'Notes', cls: 'grow' }, a => calc(() => rel(a.date, t, 'ago'))],

      () => ({ name: '', date: '', time: '', notes: '' }), { empty: 'No appointments.' });

  },

  todo() { return list(data.todo, [{ k: 'done', t: 'check', ph: 'Done' }, { k: 'text', ph: 'To do', cls: 'grow' }], () => ({ text: '', done: false })); },

  spend() { return list(data.spend, [{ k: 'done', t: 'check', ph: 'Done' }, { k: 'text', ph: 'Spending priority', cls: 'grow' }], () => ({ text: '', done: false })); },

  budget() {

    const b = data.budget;

    const accts = it => ['', ...b.accounts, ...(it.account && !b.accounts.includes(it.account) ? [it.account] : [])];

    const cols = [

      { k: 'name', ph: 'Name', cls: 'grow' },

      it => it.auto ? calc(() => '$' + budgetCalc().amt(it).toFixed(2) + ' (auto)') : field(it, 'amount', 'number', '$', 'amt'),

      it => select(it, 'account', accts(it), 'Account')

    ];

    const make = () => ({ name: '', amount: 0, account: '' });

    const nums = a => list(a, [(it, arr, i) => field(arr, i, 'signed', '$', 'amt')], () => 0);

    return [

      h('h3', {}, 'Fortnightly income'),

      list(b.income, [{ k: 'name', ph: 'Name', cls: 'grow' }, { k: 'amount', t: 'number', ph: '$', cls: 'amt' }], () => ({ name: '', amount: 0 })),

      h('h3', {}, 'Fortnightly expenses'), list(b.fortnightly, cols, make),

      h('h3', {}, 'Monthly expenses'), list(b.monthly, cols, make),

      h('h3', {}, 'Annual expenses'), list(b.annual, cols, make),

      h('h3', {}, 'Emergency costs this fortnight'), nums(b.emergencies),

      h('h3', {}, 'Electricity bills (quarterly)'), nums(b.electricity),

      h('p', { class: 'note' }, calc(() => 'Annual estimate: $' + budgetCalc().elec.toFixed(2) + ' (average × 4)')),

      h('h3', {}, 'Accounts, in transfer order'),

      list(b.accounts, [(it, arr, i) => field(arr, i, 'text', 'Account', 'grow')], () => ''),

      setting('Investment account', select(b, 'investAccount', ['', ...b.accounts], 'Investment account')),

      h('h3', {}, 'This fortnight'),

      calc(budgetText, 'out', 'div')

    ];

  },

  money() {

    const m = data.money;

    return [

      setting('Savings target $', field(m, 'savingsTarget', 'number', '$', 'amt')),

      setting('Savings balance $', field(m, 'savingsBalance', 'number', '$', 'amt')),

      setting('Annual invest goal $', field(m, 'investGoal', 'number', '$', 'amt')),

      setting('Home loan rate %', field(m, 'mortgageRate', 'number', '%', 'amt')),

      setting('Mortgage threshold %', field(m, 'mortgageThreshold', 'number', '%', 'amt')),

      h('h3', {}, 'Holdings: asset, value $, target %'),

      list(m.holdings, [{ k: 'asset', ph: 'Asset', cls: 'grow' }, { k: 'value', t: 'number', ph: '$', cls: 'amt' }, { k: 'target', t: 'number', ph: '%', cls: 'amt' }],

        () => ({ asset: '', value: 0, target: 0 })),

      calc(moneyText, 'out', 'div')

    ];

  },

  goals() {

    const t = today();

    return list(data.goals, [{ k: 'done', t: 'check', ph: 'Done' }, { k: 'name', ph: 'Goal', cls: 'grow' }, { k: 'target', t: 'date', ph: 'Target date' },

      { k: 'progress', t: 'number', ph: '%', cls: 'amt' }, g => calc(() => g.done ? 'done' : rel(g.target, t, 'past target'))],

      () => ({ id: uid(), name: '', target: '', progress: 0, done: false }), { empty: 'No goals yet.' });

  },

  challenges() {

    const t = today();

    const status = c => {

      if (c.done) return 'done';

      const n = dayNum(t.iso) - dayNum(c.start) + 1, len = num(c.days);

      if (isNaN(n)) return '';

      if (n < 1) return 'starts ' + rel(c.start, t, 'ago');

      if (len && n > len) return 'finished';

      return 'day ' + n + (len ? ' of ' + len : '');

    };

    return list(data.challenges, [{ k: 'done', t: 'check', ph: 'Done' }, { k: 'name', ph: 'Challenge', cls: 'grow' }, { k: 'start', t: 'date', ph: 'Start' },

      { k: 'days', t: 'number', ph: 'Days', cls: 'amt' }, c => calc(() => status(c))],

      () => ({ id: uid(), name: '', start: t.iso, days: 30, done: false }), { empty: 'No challenges yet.' });

  },

  values() { return list(data.values, [(it, arr, i) => field(arr, i, 'area', 'Value')], () => ''); }

};



function combined() {

  const sel = data.settings.combined;

  return [

    h('div', { class: 'chips' }, Object.keys(SECTIONS).map(k => h('button', {

      class: 'chip' + (sel.includes(k) ? ' on' : ''), 'aria-pressed': String(sel.includes(k)),

      onclick: () => { const i = sel.indexOf(k); if (i < 0) sel.push(k); else sel.splice(i, 1); changed(true); }

    }, SECTIONS[k]))),

    sel.length ? null : h('p', { class: 'note' }, 'Tap the sections above to combine them here.'),

    sel.filter(k => R[k]).map(k => h('section', {}, h('h2', {}, SECTIONS[k]), R[k](true)))

  ];

}



/* ---------- render ---------- */

function paintHeader() {

  const t = today();

  $('date').textContent = t.label;

  $('sub').textContent = !data ? 'No data loaded' : (schedKey(t).alt ? 'Alt week' : 'Normal week') + (dirty ? ' · unsaved changes' : ' · saved');

  $('saveBtn').textContent = dirty ? 'Save •' : 'Save';

}

function adopt(d, isDirty) {

  if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('not a data file');

  data = normalise(d); dirty = isDirty; store(); render();

}

function render() {

  derived = [];

  const main = $('main'), nav = $('tabs');

  main.textContent = '';

  if (!data) {

    nav.textContent = '';

    const ta = h('textarea', { rows: 4, placeholder: 'Or paste the JSON here', 'aria-label': 'Paste JSON' });

    main.append(h('section', {},

      h('h2', {}, 'No data on this device yet'),

      h('p', { class: 'note' }, 'Load ' + FILE + ' from Files, paste its contents, or start blank.'),

      h('button', { class: 'add', onclick: () => $('file').click() }, 'Load from Files'),

      h('div', { style: 'margin-top:12px' }, ta),

      h('button', { class: 'add', onclick: () => { try { adopt(JSON.parse(ta.value), true); } catch (e) { alert('That is not valid JSON: ' + e.message); } } }, 'Use pasted data'),

      h('button', { class: 'add', onclick: () => adopt(blank(), true) }, 'Start blank')));

    paintHeader();

    return;

  }

  lastDay = today().iso;

  if (!nav.children.length) ['combined', ...Object.keys(SECTIONS)].forEach(k => nav.append(

    h('button', { 'data-k': k, onclick: () => { tab = k; render(); window.scrollTo(0, 0); } }, k === 'combined' ? 'Combined' : SECTIONS[k])));

  [...nav.children].forEach(b => b.classList.toggle('on', b.dataset.k === tab));

  main.append(h('div', {}, tab === 'combined' ? combined() : h('section', {}, h('h2', {}, SECTIONS[tab]), R[tab](false))));

  main.querySelectorAll('textarea').forEach(fit);

  paintHeader();

}



/* ---------- load / save ---------- */

$('loadBtn').addEventListener('click', () => $('file').click());

$('file').addEventListener('change', async e => {

  const f = e.target.files[0];

  e.target.value = '';

  if (!f) return;

  try {

    const d = JSON.parse(await f.text());

    if (dirty && !confirm('This device has unsaved changes. Replace them with the file?')) return;

    adopt(d, false);

  } catch (err) { alert('Could not read that file: ' + err.message); }

});

$('saveBtn').addEventListener('click', async () => {

  if (!data) return;

  data.savedAt = new Date().toISOString();

  const file = new File([JSON.stringify(data, null, 2)], FILE, { type: 'application/json' });

  try {

    if (navigator.canShare && navigator.canShare({ files: [file] })) {

      await navigator.share({ files: [file] });

    } else {

      const a = h('a', { href: URL.createObjectURL(file), download: FILE });

      document.body.append(a); a.click(); a.remove();

    }

    dirty = false; store(); paintHeader();

  } catch (err) { if (err.name !== 'AbortError') alert('Save failed: ' + err.message); }

});



/* ---------- daily refresh ---------- */

const tick = () => { if (data && !document.hidden && today().iso !== lastDay) render(); };

document.addEventListener('visibilitychange', tick);

window.addEventListener('pageshow', tick);

setInterval(tick, 60000);



render();

</script>

</body>
